name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests, debug APKs and lint
        run: bash gradlew :domain:test :app:testDebugUnitTest :data:testDebugUnitTest assembleDebug :app:assembleDebugAndroidTest :data:assembleDebugAndroidTest lintDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: circapin-debug
          path: app/build/outputs/apk/debug/*.apk
